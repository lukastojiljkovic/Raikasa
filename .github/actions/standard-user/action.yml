# SPDX-License-Identifier: MIT
#
# Runs a PowerShell script as a fresh standard (non-administrator) local user on a
# GitHub-hosted Windows runner. Template: engineering-standard.md, sections 3.1, 3.2
# and 7.4 (round 2, R2-B6; cross-pollination.md S-14 and P-02).
#
# Why: "Windows virtual machines are configured to run as administrators with User
# Account Control (UAC) disabled"
# (https://docs.github.com/en/actions/reference/runners/github-hosted-runners), so a
# test that must hold for an unelevated user, a second user or a per-user install
# proves nothing when the job runs it directly. The script creates an account in the
# Users group only, runs the given script under the chosen token kind, checks that
# token from inside (a check that is first seen failing on the runner's own elevated
# token), returns the script's exit code, and deletes the account.
#
# Token kinds (PerfWindow's specification, section 4.3, which measured why both exist):
#   desktop  an interactive logon: INTERACTIVE (S-1-5-4) present, BATCH (S-1-5-3)
#            absent. For everything that stands for a person at the PC. Two routes,
#            chosen with desktop-route:
#              credential  Start-Process -Credential (CreateProcessWithLogonW, Secondary
#                          Logon service);
#              logonuser   LogonUserW with LOGON32_LOGON_INTERACTIVE, then
#                          CreateProcessWithTokenW;
#              auto        credential, then logonuser when the child never started.
#            Both grant the account the window station and desktop first.
#   batch    a scheduled task registered with the password at -RunLevel Limited:
#            BATCH present, INTERACTIVE absent. For refusal gates and steps that never
#            need a desktop.
# A filtered administrator token (Administrators deny-only) is not a standard user and
# fails the check, and so does a token of any account but the one the run created.
# Call the action once per identity a test needs; a second-user test calls it twice.
#
# Exit codes: the script's own when the check passes; 90 the token is not a standard
# user's; 91 the self-test cannot tell an elevated token; 92 the script never started.
#
# The tests: tests/StandardUser.Tests.ps1 (Pester 5) covers the run, the check, the
# routes and the cleanup with mocks; probes/ holds the scripts of the runner proof.
#
# Status: written in phase 1, the second route and the tested module added in B0; not
# yet run on a hosted runner. Step 0 of section 11 runs the probes in probes/ on
# windows-2025 and records which route works. If neither desktop route works there,
# the desktop-token gates follow PerfWindow's fallback: Windows Sandbox first, then the
# maintainer's PC from a standard account after a fresh restore point, and only when
# the maintainer clicks Run.

name: Run as a standard user
description: Runs a PowerShell script as a fresh standard local user and checks that its token is not elevated.

inputs:
  script:
    description: Path of the PowerShell script to run, relative to the workspace. It runs as the account, with the workspace as its working directory. The action grants the account read access to the workspace and write access to $env:STANDARD_USER_OUT and to a temporary folder of its own, which is its TEMP and TMP and is removed afterwards, and nothing else; what else it may write follows the runner's own permissions.
    required: true
  token:
    description: "desktop or batch (see the header)."
    required: true
  timeout-minutes:
    description: Minutes the script may run before it is stopped.
    default: "30"
  desktop-route:
    description: "For the desktop token only: auto (credential, then logonuser when the child never started), credential or logonuser (see the header)."
    required: false
    default: auto

outputs:
  route:
    description: The route that ran the script (credential, logonuser or batch), or the last route tried when none started it.
    value: ${{ steps.run.outputs.route }}
  out-dir:
    description: The folder the script wrote to ($env:STANDARD_USER_OUT). It keeps the child's groups.csv and user.csv, output.log, and the action's result.json and cleanup.json.
    value: ${{ steps.run.outputs.out-dir }}

runs:
  using: composite
  steps:
    - name: Run the script as a standard user (${{ inputs.token }} token)
      id: run
      shell: pwsh
      env:
        SU_SCRIPT: ${{ inputs.script }}
        SU_TOKEN: ${{ inputs.token }}
        SU_TIMEOUT: ${{ inputs.timeout-minutes }}
        SU_DESKTOP_ROUTE: ${{ inputs.desktop-route }}
      run: '& (Join-Path $env:GITHUB_ACTION_PATH "run-as-standard-user.ps1") -Script $env:SU_SCRIPT -Token $env:SU_TOKEN -TimeoutMinutes ([int]$env:SU_TIMEOUT) -DesktopRoute $env:SU_DESKTOP_ROUTE'
