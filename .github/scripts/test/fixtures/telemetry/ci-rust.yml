# Cut from .github/workflows/ci-rust.yml for check-hygiene.test.mjs, telemetry (5) (B0-U01): the template's file
# without its header comment and without its jobs fmt, boundary, core-linux, coverage, supply-chain, unsafe,
# mutation, red-green, fuzz-build, bench, package, standard-user, gate. Every other line is the template's, with
# UI_GATES filled. The test "telemetry (5)'s fixtures are cut from the template's own files" compares it with that
# file; cut it again when the file changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # nightly.yml runs the whole CI again
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # Git Bash on windows-2025, so one script works on both runner kinds

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # no PowerShell telemetry (PG-D14): the Windows jobs run `shell: pwsh` steps and the toxiproxy action's
  # Windows start step. pwsh 7 sends it unless this is set (PowerShell Telemetry.cs: "true, yes, or 1");
  # on Windows it also needs the diagnostic level Enhanced, which the windows-2025 image sets off (inference).
  POWERSHELL_TELEMETRY_OPTOUT: "1"
  # The nightly toolchain for cargo-fuzz and Miri, pinned by date (N9; ledger seq 23). Its
  # manifest lists miri-preview and rust-src for x86_64 Linux (read 2026-11-06).
  NIGHTLY: nightly-2026-10-30
  # llvm-mingw, the C toolchain and linker of the gnullvm target (PG-D10): its GitHub
  # release asset, pinned by URL and SHA-256 (ledger seq 9).
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-x86_64.zip
  LLVM_MINGW_SHA256: 552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f
  LLVM_MINGW_DIR: llvm-mingw-20261104-ucrt-x86_64

jobs:
  lint:
    # clippy sees only the code compiled for its host, so it runs on the one host the app
    # ships for: Windows, gnullvm (PG-D10).
    name: clippy (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gnullvm host, so build scripts and proc macros are built and linked with
      # llvm-mingw too, never with the runner's MSVC (PG-D10, PG-D36).
      - &rust-gnullvm
        name: Rust for the gnullvm host (PG-D10)
        run: |
          rustup set default-host x86_64-pc-windows-gnullvm
          rustup toolchain install # reads rust-toolchain.toml
          rustc -vV
          if ! rustc -vV | grep -qx 'host: x86_64-pc-windows-gnullvm'; then
            echo "::error::the toolchain host is not x86_64-pc-windows-gnullvm (PG-D10)"; exit 1
          fi
      - &llvm-mingw
        name: llvm-mingw 20261104 (PG-D10; ledger seq 9)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri $env:LLVM_MINGW_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_MINGW_SHA256) {
            Write-Output "::error::llvm-mingw zip SHA-256 is $hash, expected $env:LLVM_MINGW_SHA256"
            exit 1
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          # First on PATH, ahead of the runner's own MinGW and Strawberry Perl compilers.
          Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_DIR\bin" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Cargo.toml [workspace.lints] sets unsafe_code = "forbid" in every crate that
      # needs no unsafe, and clippy::undocumented_unsafe_blocks = "deny" where it does.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Build and test (Windows)
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-D warnings" # a warning in a cfg'd test path fails here too
      INSTA_UPDATE: "no" # a missing or different snapshot fails; nothing is written
    steps:
      # No harden-runner: none on Windows (CV-D58, decided in this rewrite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *rust-gnullvm
      - *llvm-mingw
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151 # ledger seq 30
      # Toxiproxy on 127.0.0.1:8474 and TOXIPROXY_URL for the slow-network tests (section
      # 10.1; round 3, R3-B2), which are ordinary tests of the run below.
      - uses: ./.github/actions/toxiproxy # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ (rhysd/actionlint#711)
      # Unit, integration, regression, slow-network and AccessKit-tree snapshot tests. The
      # image snapshots are not compiled here (no image_snapshots cfg); ui-gates runs them.
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - run: cargo test --workspace --doc --locked
      # Every product has an updater (R4) and so has slow-network tests: the updater and
      # every download behind a Toxiproxy proxy with bandwidth, latency, reset_peer,
      # timeout and limit_data toxics (section 10.1). They live in integration-test files
      # named tests/slow_network.rs, so nextest reports them under a `slow_network` binary.
      # A run in which none ran means they were renamed or filtered away, and fails. A
      # crate with no updater and no download (a CLI-only or library crate) deletes this step.
      - name: The slow-network tests ran
        if: ${{ !cancelled() }}
        run: |
          n="$(grep -o '<testcase [^>]*>' target/nextest/ci/junit.xml | grep -c 'classname="[^"]*slow_network' || true)"
          echo "slow-network test cases: $n"
          if [ "$n" -eq 0 ]; then echo "::error::no test of a tests/slow_network.rs binary ran (section 10.1, slow networks)"; exit 1; fi
      - &no-baseline
        name: No baseline was written
        if: ${{ !cancelled() }}
        run: |
          changed="$(git status --porcelain --untracked-files=all -- ':(glob)**/snapshots/**' ':(glob)**/*.snap')"
          if [ -n "$changed" ]; then echo "::error::a test wrote a baseline in CI:"; echo "$changed"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            target/nextest/ci/junit.xml
            **/*.snap.new
          retention-days: 14

  ui-gates:
    # The advanced-UI playbook's gates (advanced-ui-playbook.md section 4) for an egui
    # app: the playbook's gates G1 to G10, G17 and G22 to G28 for a lane-A window, G11 to
    # G16 where it has GPU graphics (Symphonically), run by the playbook's gate runner from
    # the copy vendored in this repository (its open question 17). Until a gate's script
    # exists, the slot runs the gates that do and the missing ones are recorded as
    # deferrals in the project's internal plan (section 3.9; round 2, N21). Delete this
    # job in a crate with no user interface (a CLI or a service).
    #
    # It also renders the egui_kittest image snapshots. GitHub's Windows runners have no
    # GPU, so wgpu's DX12 back end gets only WARP, the "Microsoft Basic Render Driver"
    # (inference; verify at adoption). Image snapshots stay in CI only while WARP
    # reproduces its own baselines (the software-renderer spike of section 3.2, B16; the
    # Instructium spike S6 and the PeepHole spike SP-CI2 run it too). Delete the
    # image-snapshot step if the section 3.2 WARP check fails: the AccessKit-tree
    # snapshots and the package smoke's reviewed real-window screenshots then carry the
    # check.
    name: Advanced-UI gates and image snapshots (Windows, WARP)
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      WGPU_BACKEND: dx12 # WARP through DX12 (inference; verify at adoption)
      WGPU_ADAPTER_NAME: Microsoft Basic Render Driver
      UPDATE_SNAPSHOTS: "false" # egui_kittest: compare only (its Mode::Test)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *rust-gnullvm
      - *llvm-mingw
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151 # ledger seq 30
      # kittest.toml sets output_path, the threshold the WARP baselines need (measured by
      # the spike; never raised without a measured reason) and a max_failed_pixels of 0.
      - name: Image snapshots through WARP
        env:
          RUSTFLAGS: "-D warnings --cfg image_snapshots"
        run: cargo nextest run --workspace --all-features --locked --profile ci --no-tests=fail -E 'binary(image_snapshots)'
      - *no-baseline
      - run: "cargo xtask ui-gates"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ui-results
          path: |
            target/nextest/ci/junit.xml
            **/tests/snapshots/*.new.png
            **/tests/snapshots/*.diff.png
          retention-days: 14

