# Cut from .github/workflows/release.yml for check-hygiene.test.mjs, telemetry (5) (B0-U01): the template's file
# without its header comment and without its jobs build, sbom, sign. Every other line is the template's, with
# VERSION_CMD and APP_NAME filled. The test "telemetry (5)'s fixtures are cut from the template's own files"
# compares it with that file; cut it again when the file changes.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # no GitHub CLI telemetry (PG-D14, G-26 A): gh sends sampled telemetry by default since 2026-04 (cli/cli internal/telemetry/telemetry.go)
  GH_TELEMETRY: "0"
  # no PowerShell telemetry (PG-D14): the build job runs `shell: pwsh` steps on windows-2025
  # (PowerShell Telemetry.cs: "true, yes, or 1" turns it off)
  POWERSHELL_TELEMETRY_OPTOUT: "1"

jobs:
  verify-tag:
    name: Tag, version and changelog agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # the CI gate's result on the tagged commit
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          egress-policy: block
          disable-telemetry: true
          # checkout (full history); the check-run query of the CI gate (inference)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag on a commit whose CI is red, still running or never ran does not ship
      # (N8). On main every commit arrived through a pull request whose gates passed,
      # and the push to main runs the CI again; that run's aggregate is what counts.
      - name: The tagged commit passed the CI gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20gate" --jq '[.check_runs[].conclusion] | if length == 0 then "missing" elif all(. == "success") then "success" else map(tostring) | join(",") end')"
          [ "$result" = "success" ] || { echo "::error::CI gate on $GITHUB_SHA is $result; release the commit only after its CI is green"; exit 1; }
      - id: v
        run: |
          version="$(cargo pkgid | cut -d@ -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
          grep -qE "^## \[$(printf '%s' "$version" | sed 's/\./\\./g')\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Attest and publish
    needs: [verify-tag, build, sbom, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      # No harden-runner: this job attests and publishes what goes live, with first-party
      # actions only (see the header).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-sums
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Every file matches the signed checksums
        run: (cd dist && sha256sum --check --strict ../SHA256SUMS.txt)
      # Attestations need a public repository on GitHub Free, Pro or Team
      # (https://github.com/github/docs/blob/main/data/reusables/gated-features/attestations.md).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          # The backticks are Markdown code spans in the release notes, not command
          # substitutions, so the single quotes are intended (R2-B8).
          # shellcheck disable=SC2016
          {
            printf '\n## Verify the download\n\n'
            printf 'Every file is listed in `SHA256SUMS.txt`, signed with the release key (`SHA256SUMS.txt.sig`).\n'
            printf 'Build provenance: `gh attestation verify <file> --repo %s`\n' "$GITHUB_REPOSITORY"
            # The shared SmartScreen paragraph (PG-D18; knowledge/templates/texts/smartscreen-faq.md, cut 3, text "release-notes").
            printf '\n%s\n' 'The Windows download is not code-signed, so Windows may warn about it (SmartScreen, and Smart App Control where it is on). Check the SHA-256 of the download against `SHA256SUMS.txt` before you run it; the steps are in the README, in the section "Windows warns about the download". The Ed25519 signature on `SHA256SUMS.txt` is not code signing.'
          } >> notes.md
      # The release is created as a draft with every asset, so nobody sees a release with
      # half its files; the next step checks the draft, and the last one publishes it.
      # This job runs only after Luka's Approve click on the `release` environment (the
      # sign job), which follows his written approval and tag (PG-D24, PL-5).
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS.txt SHA256SUMS.txt.sig sbom.cdx.json \
            --title "App $VERSION" --notes-file notes.md --verify-tag --draft
          echo "Draft created for $GITHUB_REF_NAME."
      # The draft holds exactly the files that were checked against the signed sums.
      - name: The draft holds every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$( { (cd dist && ls -1); printf '%s\n' SHA256SUMS.txt SHA256SUMS.txt.sig sbom.cdx.json; } | sort)"
          actual="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the draft's assets differ from the checked files"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
