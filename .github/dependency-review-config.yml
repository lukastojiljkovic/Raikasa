# Generated by .github/scripts/licence-configs.mjs from .github/licence-policy.json
# (profile permissive). Do not edit: change the policy and run
#   node .github/scripts/licence-configs.mjs --write
# CI runs it with --check, which fails when this file differs from what the policy generates (PG-D3).
# Read by .github/workflows/dependency-review.yml (config-file). The action fails a pull
# request that adds a dependency whose licence is not on allow-licenses; a licence it cannot
# detect does not fail it, so the stack CI's licence job (check-licences.mjs, cargo-deny) stays
# the gate over the whole tree.

# Class L of profile permissive.
allow-licenses:
  - 'MIT'
  - 'MIT-0'
  - '0BSD'
  - 'ISC'
  - 'BSD-2-Clause'
  - 'BSD-3-Clause'
  - 'Zlib'
  - 'BSL-1.0'
  - 'Unlicense'
  - 'CC0-1.0'
  - 'Unicode-3.0'
  - 'Unicode-DFS-2016'
  - 'Python-2.0'
  - 'PSF-2.0'
  - 'BlueOak-1.0.0'
  - 'CDLA-Permissive-2.0'
  - 'WTFPL'
  - 'Apache-2.0'
  - 'Apache-2.0 WITH LLVM-exception'
  - 'MPL-2.0'
  - 'LGPL-2.1-only'
  - 'LGPL-2.1-or-later'
  - 'LGPL-3.0-only'
  - 'LGPL-3.0-or-later'
  - 'LicenseRef-Microsoft-WindowsAppSDK'
  - 'LicenseRef-Microsoft-WindowsSDK-BuildTools'

# Denied components (PG-D31): codecs whose patent holders or pools license them.
deny-packages:
  - 'pkg:cargo/openh264'
  - 'pkg:cargo/openh264-sys2'
  - 'pkg:cargo/x264'
  - 'pkg:cargo/x265'
  - 'pkg:cargo/libde265'
  - 'pkg:cargo/fdk-aac'
  - 'pkg:cargo/fdk-aac-sys'
  - 'pkg:cargo/symphonia-codec-aac'
  - 'pkg:cargo/ffmpeg-next'
  - 'pkg:cargo/ffmpeg-sys-next'
  - 'pkg:npm/ffmpeg-static'
  - 'pkg:npm/%40ffmpeg-installer/ffmpeg'
  - 'pkg:npm/%40ffmpeg/core'
  - 'pkg:cargo/dav1d'
  - 'pkg:cargo/dav1d-sys'
  - 'pkg:cargo/rav1d'
  - 'pkg:cargo/rav1e'
  - 'pkg:cargo/aom-sys'
  - 'pkg:cargo/env-libvpx-sys'
  - 'pkg:cargo/opus'
  - 'pkg:cargo/audiopus_sys'
  - 'pkg:cargo/libwebp-sys'
  - 'pkg:cargo/webp'
