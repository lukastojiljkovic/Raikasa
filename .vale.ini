# Vale: English prose in the site, README, changelog and docs (R14). Every repository runs it
# on its public Markdown through pr-policy.yml's `docs` job (README, CHANGELOG, the other root
# documents, docs/ and .github/); CODE_OF_CONDUCT.md (Contributor Covenant, adopted verbatim)
# and the generated THIRD-PARTY-NOTICES.md are not checked, because their text is not ours to
# change. Sites also run it on the built pages (ci-site.yml).
#
# The vocabulary (.vale/styles/config/vocabularies/Program/accept.txt) names the public
# projects only. A private project (R17) adds its own name to the copy in its own private
# repository, so the template copied into public repositories never names it. The rest of
# the file is words the dictionary lacks. Vale.Terms wants each entry written exactly as the
# file has it; an entry that starts with (?i) is accepted in any case (measured with Vale
# 3.26.0: `(?i)changelog` passes `Changelog` and `CHANGELOG`, a bare `changelog` does not).
#
# `vale sync` downloads the Microsoft style package from the release archive named
# below. A bare `Packages = Microsoft` resolves to whatever release is newest; the URL
# pins the release (round 2, N25). Vale checks no hash of the archive, so E3 records
# this as a version pin, not a content pin. Raise the version by hand (v0.15.1 was the
# newest on 2026-11-11).
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Program
Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.15.1/Microsoft.zip

[*.{md,html}]
BasedOnStyles = Vale, Microsoft
# Vale lints the text of an e-mail autolink (`<name@host>`), so Vale.Terms reports the
# contact address's `luka` and `stojiljkovic` against the vocabulary (8 alerts in PRIVACY,
# SECURITY, TERMS and TRADEMARKS, Vale 3.26.0, 2026-11-25). Each of those four contact lines
# turns Vale.Terms off around its autolink alone, with text before it on the same line:
# `Write to <!-- vale Vale.Terms = NO --><name@host><!-- vale Vale.Terms = YES --> for ...`.
# That hides the address's Vale.Terms alerts only: every rule, Vale.Terms included, still
# checks the rest of the paragraph. The text before the comment is needed: a line that begins
# with `<!--` is raw HTML in CommonMark, so its autolink is no link on the page, and Vale then
# skips the address as a tag, with or without the switch (inspector 7, 2026-11-26).
# The docs job's .github/scripts/check-docs.mjs fails on an e-mail autolink that is no link
# on the page, on a `= NO` without its `= YES` later on the same line (a switch left open
# hides the rest of the file), and on `<!-- vale off -->`. The rules job's
# test/docs-gate.test.mjs fails on any key this file does not already use, written with `=`
# or `:`: TokenIgnores, BlockIgnores, SkippedScopes and IgnoredScopes each hide prose (with a
# TokenIgnores pattern for autolinks, Vale skipped the words between a lone backtick and the
# next autolink of the paragraph; Vale 3.26.0, 2026-11-26). It also fails on a BasedOnStyles
# that does not name Vale and Microsoft (an empty one silenced Vale), and on a vale.ini,
# _vale, _vale.ini or .vale file at the root, which Vale reads instead of this file. The
# same two comments work in HTML, around a `mailto:` link on a built page.
# Rules the program writes differently on purpose (one sentence each, here):
# The headings carry the app's name with its own capitals, which this rule, a suggestion the job does not show, reports.
Microsoft.Headings = NO
# The program writes "do not" and "is not" in full, in its documents and its legal texts.
Microsoft.Contractions = NO
# The program sets an em dash between spaces, as in the warranty line of the README and TERMS.
Microsoft.Dashes = NO
# The program keeps a comma or a full stop outside the quotation marks: after a quoted term of a legal text, and after a quoted interface string, such as the Windows dialog the README names.
Microsoft.Quotes = NO
